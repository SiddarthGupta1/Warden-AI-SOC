apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-agent
  namespace: warden
  labels:
    app: warden-agent
spec:
  # Pinned to one replica on purpose. The application stores users, triage reports
  # and the remediation audit trail in SQLite on a ReadWriteOnce volume, so a second
  # replica would either fail to attach the disk or operate on a different database.
  # Scaling out requires moving to a networked database first (see aks/pvc.yaml).
  replicas: 1
  selector:
    matchLabels:
      app: warden-agent
  # Recreate, not RollingUpdate. A rolling update starts the new pod before
  # terminating the old one, and the ReadWriteOnce disk is still attached to the
  # old pod's node - the new pod blocks in ContainerCreating and the rollout
  # deadlocks. Recreate accepts brief downtime instead of never completing.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: warden-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agent
          image: YOUR_ACR_NAME.azurecr.io/warden-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: warden-config
            - secretRef:
                name: warden-secret
          env:
            # Point the database at the mounted volume rather than the container
            # filesystem, which is discarded on every restart and image rollout.
            - name: DATABASE_PATH
              value: /data/soc_agent.db
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: warden-data
