apiVersion: v1
kind: Secret
metadata:
  name: warden-secret
  namespace: warden
type: Opaque
stringData:
  # Sensitive Azure and OpenAI API credentials (populate in your private environment).
  #
  # Do NOT commit real values here. Either create the Secret out-of-band:
  #   kubectl -n warden create secret generic warden-secret \
  #     --from-literal=SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
  #     --from-literal=AZURE_CLIENT_SECRET=... --from-literal=AZURE_OPENAI_API_KEY=...
  # or use the Azure Key Vault CSI driver. The placeholder below is publicly known
  # and the application will refuse to start with it when APP_ENV=production.
  SECRET_KEY: "change-to-a-secure-random-secret-key-for-jwt"
  AZURE_CLIENT_SECRET: "YOUR_AZURE_CLIENT_SECRET"
  AZURE_OPENAI_API_KEY: "YOUR_AZURE_OPENAI_API_KEY"
  OPENAI_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  VIRUSTOTAL_API_KEY: ""
