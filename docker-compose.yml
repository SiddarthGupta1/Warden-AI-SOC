# Secrets are read from backend/.env (gitignored), never hardcoded here.
# Generate a signing key before first run:
#   python -c "import secrets; print(secrets.token_urlsafe(48))"
# and set SECRET_KEY in backend/.env. The app refuses to start in production
# without one, rather than falling back to a key published in this repository.

services:
  warden-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warden-agent
    ports:
      - "8000:8000"
    # Every secret (SECRET_KEY, Azure and OpenAI credentials, threat-intel keys)
    # comes from this file, which is gitignored. Note that Compose only passes it
    # INTO the container - it is not used for ${VAR} interpolation here, so secrets
    # are deliberately not referenced in the environment block below.
    env_file:
      - backend/.env
    environment:
      # APP_ENV=production makes the app refuse to start if SECRET_KEY is missing
      # or set to one of the values published in this repository, rather than
      # silently running with a guessable signing key.
      - APP_ENV=production
      # Must point at the mounted volume, not the container filesystem.
      - DATABASE_PATH=/data/soc_agent.db
      # The single container serves the API and the built UI on the same origin.
      - CORS_ORIGINS=["http://localhost:8000"]
    volumes:
      # Without this the SQLite database lives in the container filesystem and
      # user accounts, triage reports and the audit trail are destroyed on every
      # `docker compose down` or image rebuild.
      - warden-data:/data
    restart: unless-stopped

volumes:
  warden-data:
